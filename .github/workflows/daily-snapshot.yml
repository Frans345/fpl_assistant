name: Daily FPL snapshot

on:
  schedule:
    - cron: "23 4 * * *"
    - cron: "47 10 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Save today's snapshot
        run: python scripts/daily_snapshot.py

      - name: Commit and push
        run: |
          git config user.name "${{ github.repository_owner }}"
          git config user.email "${{ github.repository_owner_id }}+${{ github.repository_owner }}@users.noreply.github.com"
          git add snapshots
          git diff --cached --quiet || git commit -m "Add FPL snapshot for $(date -u +%F)"
          git push
